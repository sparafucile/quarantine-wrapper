{{- if .Values.mitmproxy.enabled }}
{{- if and .Values.mitmproxy.ephemeralConfig (not .Values.ca.enabled) }}
{{- fail "mitmproxy.ephemeralConfig requires ca.enabled: true (stable CA from Secret)" }}
{{- end }}
# ============================================================================
# mitmproxy/mitmweb (im Gateway-Namespace)
# Debug-Proxy mit TLS-Interception und Web-UI
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mitmproxy-certs
  namespace: {{ include "quarantine-wrapper.gwNamespace" . }}
  labels:
    {{- include "quarantine-wrapper.gwLabels" . | nindent 4 }}
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.mitmproxy.storageClass }}
  resources:
    requests:
      storage: {{ .Values.mitmproxy.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mitmproxy-debug
  namespace: {{ include "quarantine-wrapper.gwNamespace" . }}
  labels:
    {{- include "quarantine-wrapper.gwLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    {{- if .Values.mitmproxy.ephemeralConfig }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    type: Recreate      # RWO PVC — RollingUpdate haengt bei Multi-Attach
    rollingUpdate: null  # Explizit loeschen, sonst SSA-Konflikt mit altem RollingUpdate-Spec
    {{- end }}
  selector:
    matchLabels:
      app: mitmproxy-debug
  template:
    metadata:
      labels:
        app: mitmproxy-debug
        app.kubernetes.io/part-of: {{ .Values.appName }}-quarantine
    spec:
      {{- if .Values.ca.enabled }}
      initContainers:
        # Kopiert das vordefinierte CA-Keypair in das mitmproxy-Datenverzeichnis
        - name: install-ca
          image: {{ .Values.ca.initImage.repository }}:{{ .Values.ca.initImage.tag }}
          command:
            - /bin/sh
            - -c
            - |
              {{- if .Values.mitmproxy.ephemeralConfig }}
              set -eu
              umask 077
              test -s /ca-secret/mitmproxy-ca-key.pem
              test -s /ca-secret/mitmproxy-ca-cert.pem
              {{- end }}
              echo "Installing pre-defined CA keypair for mitmproxy..."
              # mitmproxy erwartet KEY+CERT kombiniert in mitmproxy-ca.pem
              cat /ca-secret/mitmproxy-ca-key.pem /ca-secret/mitmproxy-ca-cert.pem > /mitmproxy-home/mitmproxy-ca.pem
              cp /ca-secret/mitmproxy-ca-cert.pem /mitmproxy-home/mitmproxy-ca-cert.pem
              echo "CA keypair installed (combined as mitmproxy-ca.pem)."
          volumeMounts:
            - name: ca-secret
              mountPath: /ca-secret
              readOnly: true
            - name: mitmproxy-data
              mountPath: /mitmproxy-home
      {{- end }}
      containers:
        - name: mitmweb
          image: {{ .Values.mitmproxy.image.repository }}:{{ .Values.mitmproxy.image.tag }}
          command: ["mitmweb"]
          args:
            - "--mode"
            - "upstream:http://squid:{{ .Values.squid.port }}/"
            - "--web-host"
            - "0.0.0.0"
            - "--web-port"
            - "{{ .Values.mitmproxy.webPort }}"
            - "--listen-host"
            - "0.0.0.0"
            - "--listen-port"
            - "{{ .Values.mitmproxy.proxyPort }}"
            - "--set"
            - "block_global=false"
            # Stream statt Buffern fuer grosse Responses. Default 5m.
            # NICHT auf "1" setzen — verursacht intermittierende 502 bei CONNECT-Tunnels!
            - "--set"
            - "stream_large_bodies={{ .Values.mitmproxy.streamLargeBodies }}"
            {{- if .Values.ca.enabled }}
            - "--set"
            - "confdir=/home/mitmproxy/.mitmproxy"
            {{- end }}
            {{- range .Values.mitmproxy.ignoreHosts }}
            - "--set"
            - {{ printf "ignore_hosts=%s" . | quote }}
            {{- end }}
            - "--set"
            - "web_password=$(MITMWEB_PASSWORD)"
          env:
            - name: MITMWEB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mitmweb-password
                  key: password
          ports:
            - containerPort: {{ .Values.mitmproxy.proxyPort }}
              name: proxy
            - containerPort: {{ .Values.mitmproxy.webPort }}
              name: web-ui
          {{- if .Values.mitmproxy.ephemeralConfig }}
          startupProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 2
            failureThreshold: 2
          {{- end }}
          volumeMounts:
            - name: mitmproxy-data
              mountPath: /home/mitmproxy/.mitmproxy
            - name: flow-data
              mountPath: /data
          resources:
            {{- toYaml .Values.mitmproxy.resources | nindent 12 }}
      volumes:
        {{- if .Values.ca.enabled }}
        - name: ca-secret
          secret:
            secretName: {{ .Values.ca.secretName }}
        {{- end }}
        - name: mitmproxy-data
          {{- if .Values.mitmproxy.ephemeralConfig }}
          emptyDir:
            sizeLimit: 100Mi
          {{- else }}
          persistentVolumeClaim:
            claimName: mitmproxy-certs
          {{- end }}
        - name: flow-data
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mitmproxy
  namespace: {{ include "quarantine-wrapper.gwNamespace" . }}
  labels:
    {{- include "quarantine-wrapper.gwLabels" . | nindent 4 }}
spec:
  selector:
    app: mitmproxy-debug
  ports:
    - port: {{ .Values.mitmproxy.proxyPort }}
      targetPort: {{ .Values.mitmproxy.proxyPort }}
      name: proxy
    - port: {{ .Values.mitmproxy.webPort }}
      targetPort: {{ .Values.mitmproxy.webPort }}
      name: web-ui
{{- end }}
